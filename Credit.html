<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Credit</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        a {
            color: #00ffff;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .credit-box {
            background: #222;
            display: inline-block;
            padding: 30px 50px;
            border-radius: 15px;
            box-shadow: 0 0 20px #000;
        }

        p {
            font-size: 20px;
            margin: 20px 0;
        }

        .home-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background-color: #00ffff;
            color: #000;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
        }

        .home-button:hover {
            background-color: #00cccc;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="credit-box">
        <p>
